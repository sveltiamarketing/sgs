<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#4A9D2C">
<title>Sistema de Gestión Sveltia</title>

<!--
  ATAJO sgs.sveltia.mx → Sistema de Gestión Sveltia
  Repositorio: sveltiamarketing/sgs · 19-oct-2026

  ===================================================================
  POR QUÉ SE REESCRIBIÓ: EL MODO APLICACIÓN ERA EL QUE ROMPÍA TODO
  ===================================================================

  La versión anterior traía esto:

      <meta name="apple-mobile-web-app-capable" content="yes">
      <meta name="mobile-web-app-capable" content="yes">
      <link rel="manifest" href="...">

  …y un bloque que detectaba `navigator.standalone` o
  `(display-mode: standalone)` para redirigir automáticamente cuando la
  página se abría desde el icono de la pantalla de inicio.

  Esas tres líneas convierten la página en una "aplicación instalada".
  Y ahí está la trampa: una aplicación instalada se abre en una ventana
  CERRADA SOBRE SU PROPIO DOMINIO. Esta página no tiene contenido
  propio —su único trabajo es mandarte a script.google.com, que es OTRO
  dominio—, así que la redirección se queda sin a dónde ir y el usuario
  ve una pantalla en blanco. Reportado desde el stand el 19-oct-2026.

  O sea: la página se rompía justamente en el caso para el que se había
  instalado. Una página de reenvío NO DEBE SER INSTALABLE. Nunca fue una
  aplicación; era un letrero que apunta a otro lado, y un letrero no se
  cuelga en la pantalla de inicio.

  Lo que se quitó, y no se vuelve a poner:
    · apple-mobile-web-app-capable / mobile-web-app-capable
    · el manifest
    · la detección de standalone y su redirección automática
    · el modo ?fijar, que servía para instalarla (ya no hay qué instalar)

  LO QUE SE CONSERVÓ a propósito:
    · Funciona SIN JavaScript: el botón trae la dirección en el HTML.
    · La dirección aparece UNA sola vez, en el href del botón, y de ahí
      la lee el salto automático. Dos copias se desincronizan.
    · Conserva los parámetros: sgs.sveltia.mx?ace=…&t=… llega completo.
    · location.replace y no href: el botón "atrás" regresa al sitio y no
      rebota en un círculo.
    · noindex: no tiene por qué salir en Google.

  SI ALGÚN DÍA SE PUBLICA UNA IMPLEMENTACIÓN NUEVA de Apps Script (no
  una versión nueva de la misma), la dirección /exec cambia y hay que
  actualizarla AQUÍ también. Debe ser idéntica al valor de la clave
  URL_APP de la hoja Config del sistema.
-->

<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px; background: #F7F8F8; color: #2B2C2E;
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    text-align: center;
  }
  .caja { max-width: 420px; width: 100%; }
  h1 { font-size: 20px; margin: 0 0 4px; font-weight: 600; letter-spacing: -0.01em; }
  .marca { font-size: 13px; color: #6B7280; margin: 0 0 20px; }
  .barra { height: 4px; border-radius: 4px; background: #E3E6E8; overflow: hidden; margin: 0 0 20px; }
  .barra i { display: block; height: 100%; width: 40%; border-radius: 4px; background: #5DA831;
             animation: corre 1.1s ease-in-out infinite; }
  @keyframes corre { 0% { margin-left: -40%; } 100% { margin-left: 100%; } }
  .btn {
    display: inline-block; padding: 13px 26px; border-radius: 8px; background: #5DA831;
    color: #fff; text-decoration: none; font-weight: 600; font-size: 16px;
  }
  .btn:active { background: #4A8A28; }
  .pie { font-size: 13px; color: #6B7280; margin: 18px 0 0; }
  @media (prefers-color-scheme: dark) {
    body { background: #16181A; color: #E8EAEB; }
    .marca, .pie { color: #9CA3AF; }
    .barra { background: #2A2E31; }
  }
</style>
</head>
<body>
  <div class="caja">
    <h1>Sistema de Gestión</h1>
    <p class="marca">Sveltia</p>
    <div class="barra" id="barra"><i></i></div>
    <p id="aviso" style="margin:0 0 18px;font-size:14px;color:#6B7280">Abriendo…</p>
    <a class="btn" id="entrar"
       href="https://script.google.com/macros/s/AKfycbw-yLmGQqz-HqHKM-KMtwDiI20OlKYpqKAEpnjZpgdnhJBsj5r1-I8Hm9cX58s5QfKejw/exec">Entrar</a>
    <p class="pie">Si no abre solo, toca <b>Entrar</b>.</p>
  </div>

<script>
(function () {
  'use strict';
  // La dirección sale del href del botón: una sola fuente de verdad.
  var destino = document.getElementById('entrar').getAttribute('href');

  // Se conservan los parámetros que traiga la liga corta, por si algún día se acortan también
  // las ligas de aceptación del cliente (sgs.sveltia.mx?ace=…&t=…).
  var q = window.location.search;
  if (q && q.length > 1) destino += (destino.indexOf('?') === -1 ? '?' : '&') + q.slice(1);

  document.getElementById('entrar').setAttribute('href', destino);

  // Un respiro antes de saltar: si la redirección falla por cualquier motivo, al usuario le
  // queda el botón en pantalla en lugar de una página en blanco.
  setTimeout(function () {
    try { window.location.replace(destino); }
    catch (e) { mostrarBoton('No se pudo abrir solo.'); }
  }, 150);

  // Y si a los 4 segundos seguimos aquí, el salto no sirvió: se quita el "Abriendo…" y se deja
  // el botón, que es el camino que funciona siempre.
  setTimeout(function () { mostrarBoton('Toca Entrar para abrir el sistema.'); }, 4000);

  function mostrarBoton(texto) {
    var b = document.getElementById('barra');
    if (b) b.style.display = 'none';
    var a = document.getElementById('aviso');
    if (a) a.textContent = texto;
  }
})();
</script>
</body>
</html>
