<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sistema de Gestión Sveltia</title>

<!-- =====================================================================
     ATAJO A sveltia.mx/sgs  →  Sistema de Gestión (Apps Script)

     >>> LO ÚNICO QUE SE EDITA DE ESTE ARCHIVO ES EL href DEL BOTÓN "Entrar"
     >>> (búscalo abajo: id="ir"). Está en UN solo lugar a propósito, y de ahí
     >>> lo lee también el salto automático: así no existe la posibilidad de
     >>> cambiar uno y olvidar el otro.
     >>> Tiene que ser EXACTAMENTE lo que dice la clave URL_APP de la hoja
     >>> Config del Sistema de Gestión. Esa es la fuente de la verdad: si
     >>> algún día se publica una implementación NUEVA (no una versión
     >>> nueva de la misma), la dirección cambia y hay que actualizarla
     >>> aquí también.

     Se pide a los buscadores que NO lo indexen: es una herramienta interna
     y no tiene por qué aparecer en Google. Eso no la protege —la protege
     el PIN— pero evita que ande de paseo.
     ===================================================================== -->
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">

<style>
  :root { --gris: #5A5B5E; --verde: #5DA831; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--gris); background: #fff;
    display: flex; align-items: center; justify-content: center;
    padding: 24px; text-align: center; line-height: 1.5;
  }
  .caja { max-width: 420px; }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 6px; color: var(--gris); }
  p { font-size: 14px; margin: 0 0 18px; }
  .barra { height: 3px; background: #eee; border-radius: 3px; overflow: hidden; margin: 0 0 18px; }
  .barra i { display: block; height: 100%; width: 40%; background: var(--verde);
             animation: corre 1.1s ease-in-out infinite; }
  @keyframes corre { 0% { margin-left: -40%; } 100% { margin-left: 100%; } }
  a.btn { display: inline-block; padding: 10px 18px; border-radius: 8px;
          background: var(--verde); color: #fff; text-decoration: none; font-size: 14px; font-weight: 600; }
  .mini { font-size: 12px; color: #8b8c8f; margin-top: 16px; }
  @media (prefers-color-scheme: dark) {
    body { background: #1c1c1e; color: #d7d8da; }
    h1 { color: #ececee; }
    .barra { background: #333; }
  }
</style>
</head>
<body>
  <div class="caja">
    <h1>Sistema de Gestión Sveltia</h1>
    <p>Abriendo…</p>
    <div class="barra"><i></i></div>
    <!-- Si el navegador bloquea el salto automático, queda el botón. Nunca una
         pantalla en blanco: eso es lo que hace que la gente crea que se cayó. -->
    <a class="btn" id="ir" href="https://script.google.com/macros/s/AKfycbw-yLmGQqz-HqHKM-KMtwDiI20OlKYpqKAEpnjZpgdnhJBsj5r1-I8Hm9cX58s5QfKejw/exec">Entrar</a>
    <p class="mini">Si no avanza en unos segundos, toca “Entrar”.</p>
  </div>

<script>
(function () {
  'use strict';

  // La dirección sale del propio botón, que ya la trae escrita en el HTML.
  // Así funciona aunque el navegador tenga JavaScript apagado —el botón lleva
  // igual— y no hay dos copias de la dirección que se puedan desincronizar.
  var boton = document.getElementById('ir');
  var DESTINO = boton.getAttribute('href');

  // Se conserva lo que venga después de /sgs. Así siguen sirviendo las ligas
  // con parámetros, como la de aceptación del cliente (?ace=...) o la de
  // autorización (?aut=...), si algún día se quieren acortar por aquí.
  var extra = window.location.search || '';
  if (extra && DESTINO.indexOf('?') !== -1) extra = extra.replace('?', '&');

  // replace() y no href: así el botón "atrás" del navegador regresa al sitio
  // y no vuelve a caer en esta página, que rebotaría en un círculo.
  window.location.replace(DESTINO + extra);
})();
</script>
</body>
</html>
